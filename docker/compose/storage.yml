version: "3.9"

services:
  minio:
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.tailscale-only.ipallowlist.sourcerange=100.64.0.0/10,192.168.0.0/16"
      - "traefik.http.middlewares.tailscale-only.ipallowlist.sourcerange=100.64.0.0/10,192.168.0.0/16,192.168.0.100/32,80.230.95.199/32"

      # MinIO API
      - "traefik.http.routers.minio-api.rule=Host(`minio.ethangeorlette.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"

      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`console.ethangeorlette.com`)"
      - "traefik.http.routers.minio-console.middlewares=tailscale-only"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"


    volumes:
      - ./data:/data
      - ./config:/root/.minio

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - cloud-network

networks:
  cloud-network:
    external: true
