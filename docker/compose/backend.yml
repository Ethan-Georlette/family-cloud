services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - cloud-network


volumes:
  postgres-data:

networks:
  cloud-network:
    external: true
