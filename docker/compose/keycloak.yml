version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_FRONTEND_URL: "https://auth.ethangeorlette.com/"
      PROXY_ADDRESS_FORWARDING: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - cloud-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.ethangeorlette.com`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
        # Forward headers so Keycloak knows it's behind HTTPS
      - "traefik.http.middlewares.keycloak-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.keycloak.middlewares=keycloak-headers"

volumes:
  keycloak_data:

networks:
  cloud-network:
    external: true
