spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/family_cloud
    username: postgres
    password: strongpassword
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.ethangeorlette.com/realms/family-cloud

  jpa:
    hibernate:
      ddl-auto: update   # dev only
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
